name: Diagnose temporal-network Bootstrap

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uncertainty-separability-scalable-design
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: |
          mkdir -p diagnosis/rendered/src/pykdex/uncertainty diagnosis/rendered/tests
          set +e
          python -m pytest tests/test_bootstrap_temporal_network_kde.py -q > diagnosis/pytest.txt 2>&1
          echo "$?" > diagnosis/pytest-status.txt
          set -e
          python -m black src/pykdex/uncertainty/api.py src/pykdex/uncertainty/network_time.py tests/test_bootstrap_temporal_network_kde.py
          python -m isort src/pykdex/uncertainty/api.py src/pykdex/uncertainty/network_time.py tests/test_bootstrap_temporal_network_kde.py
          cp src/pykdex/uncertainty/api.py diagnosis/rendered/src/pykdex/uncertainty/api.py
          cp src/pykdex/uncertainty/network_time.py diagnosis/rendered/src/pykdex/uncertainty/network_time.py
          cp tests/test_bootstrap_temporal_network_kde.py diagnosis/rendered/tests/test_bootstrap_temporal_network_kde.py
      - uses: actions/upload-artifact@v4
        with:
          name: temporal-network-bootstrap-diagnosis
          path: diagnosis
          if-no-files-found: error
