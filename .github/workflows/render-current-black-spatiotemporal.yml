name: Render current Black spatiotemporal files

on:
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uncertainty-separability-scalable-design
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: python -m black src/pykdex/uncertainty/api.py src/pykdex/uncertainty/spatiotemporal.py tests/test_bootstrap_spatiotemporal_kde.py
      - run: python -m isort src/pykdex/uncertainty/api.py src/pykdex/uncertainty/spatiotemporal.py tests/test_bootstrap_spatiotemporal_kde.py
      - run: |
          mkdir -p rendered/src/pykdex/uncertainty rendered/tests
          cp src/pykdex/uncertainty/api.py rendered/src/pykdex/uncertainty/api.py
          cp src/pykdex/uncertainty/spatiotemporal.py rendered/src/pykdex/uncertainty/spatiotemporal.py
          cp tests/test_bootstrap_spatiotemporal_kde.py rendered/tests/test_bootstrap_spatiotemporal_kde.py
      - uses: actions/upload-artifact@v4
        with:
          name: current-black-spatiotemporal
          path: rendered
          if-no-files-found: error
