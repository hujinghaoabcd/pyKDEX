name: Audit current Black repository diff

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uncertainty-separability-scalable-design
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: python -m black src tests tools examples
      - run: |
          mkdir -p audit
          git diff --name-only > audit/changed.txt
          git diff --binary > audit/black.patch
          while IFS= read -r path; do
            mkdir -p "audit/files/$(dirname "$path")"
            cp "$path" "audit/files/$path"
          done < audit/changed.txt
      - uses: actions/upload-artifact@v4
        with:
          name: current-black-full-audit
          path: audit
          if-no-files-found: error
