name: Format spatial Bootstrap files

on:
  push:
    branches:
      - agent/uncertainty-separability-scalable-design

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'Format spatial Bootstrap implementation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==25.1.0 isort==5.13.2
      - run: >-
          python -m black
          src/pykdex/uncertainty/__init__.py
          src/pykdex/uncertainty/results.py
          src/pykdex/uncertainty/spatial.py
          tests/test_bootstrap_spatial_kde.py
      - run: >-
          python -m isort
          src/pykdex/uncertainty/__init__.py
          src/pykdex/uncertainty/results.py
          src/pykdex/uncertainty/spatial.py
          tests/test_bootstrap_spatial_kde.py
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pykdex/uncertainty/__init__.py \
            src/pykdex/uncertainty/results.py \
            src/pykdex/uncertainty/spatial.py \
            tests/test_bootstrap_spatial_kde.py
          git commit -m "Format spatial Bootstrap implementation"
          git push
