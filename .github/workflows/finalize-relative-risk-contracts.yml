name: Finalize relative-risk density contract documentation

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uncertainty-separability-scalable-design
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - name: Update guides, navigation, and recovery entry
        run: |
          python - <<'PY'
          from pathlib import Path

          guide = Path("docs/guides/bootstrap.md")
          text = guide.read_text(encoding="utf-8")
          marker = "## Current exclusions\n"
          addition = """## Relative-risk compatibility metadata

          Every completed KDE Bootstrap result and ensemble now records an immutable normalized
          compatibility mapping:

          ```text
          relative_risk_contract
          relative_risk_contract_fingerprint
          ```

          The mapping is not a relative-risk estimate. It is an auditable prerequisite used to decide
          whether independently generated case and control density ensembles share the same fixed
          estimator and exact measured support.

          All families use the common keys:

          ```text
          schema_version
          result_family
          support_fingerprint
          target
          bandwidths
          ```

          Family-specific fields describe kernels, metric or junction policy, boundary identity,
          direction, network identity, heat policy, time domain, and cyclic-tail choices where
          relevant.

          The contract deliberately excludes event data, sample size, numerical fields, seed
          metadata, workers, chunks, memory budgets, and completion order. Consequently case and
          control groups with different observations can remain compatible, while a meaningful
          smoothing or support difference changes the contract fingerprint.

          The mapping is read-only. A standard dictionary view can be serialized for audit:

          ```python
          contract = result.metadata["relative_risk_contract"]
          serializable = dict(contract)
          ```

          The pre-existing estimator contract fingerprint remains available and unchanged. The
          normalized relative-risk contract exists specifically for cross-group compatibility and
          human-readable mismatch diagnostics.

          """
          if text.count(marker) != 1:
              raise RuntimeError("expected one Bootstrap exclusions heading")
          guide.write_text(text.replace(marker, addition + marker), encoding="utf-8")

          mkdocs = Path("mkdocs.yml")
          text = mkdocs.read_text(encoding="utf-8")
          old = "      - 0.0.16 relative-risk Bootstrap design: development/design-0.0.16-relative-risk-bootstrap.md\n"
          new = old + "      - 0.0.16 progress 02H-1: development/handoff-0.0.16-progress-02h-1-relative-risk-contracts.md\n"
          if text.count(old) != 1:
              raise RuntimeError("expected one relative-risk design navigation entry")
          mkdocs.write_text(text.replace(old, new), encoding="utf-8")

          handoff = Path("HANDOFF_NEXT_CONVERSATION.md")
          text = handoff.read_text(encoding="utf-8")
          old = "9. detailed 02H independent relative-risk Bootstrap design.\n"
          new = old + "10. normalized 02H-1 shared density-contract metadata.\n"
          if text.count(old) != 1:
              raise RuntimeError("expected one completed design list entry")
          text = text.replace(old, new)
          old = """The exact next implementation subunit is 02H-1: normalized shared density-contract
          metadata for all completed density Bootstrap adapters. Do not begin numerical ratio ensembles
          or public relative-risk symbols before that prerequisite passes full CI.
          """
          new = """The exact next implementation subunit is 02H-2: the linked immutable
          `RelativeRiskBootstrapResult` validation container. Do not compute raw/log ratio ensembles or
          expose `bootstrap_relative_risk` before the container and its validation tests pass full CI.
          """
          if text.count(old) != 1:
              raise RuntimeError("expected one 02H-1 next-unit summary")
          text = text.replace(old, new)
          old = "14. `HANDOFF_0.0.16_DESIGN_RELATIVE_RISK_BOOTSTRAP.md`.\n"
          new = (
              old
              + "15. `HANDOFF_0.0.16_PROGRESS_02H_1_RELATIVE_RISK_CONTRACTS.md`.\n"
              + "16. `docs/development/handoff-0.0.16-progress-02h-1-relative-risk-contracts.md`.\n"
          )
          if text.count(old) != 1:
              raise RuntimeError("expected one relative-risk design read-order ending")
          text = text.replace(old, new)
          text = text.replace(
              "- exact next unit: 02H-1 normalized shared density-contract metadata.\n",
              "- exact next unit: 02H-2 linked relative-risk result validation types.\n",
          )
          start = text.index(
              "## Exact next implementation subunit: 02H-1 shared density-contract metadata\n"
          )
          suffix = """## Completed subunit 02H-1: normalized shared density contracts

          Common metadata keys:

          ```text
          relative_risk_contract
          relative_risk_contract_fingerprint
          ```

          Implemented families:

          ```text
          spatial
          network
          heat_network
          spatiotemporal
          network_time
          ```

          Rules:

          - the contract is an immutable mapping proxy;
          - a standard dictionary view is JSON serializable;
          - common fields are schema version, family, support fingerprint, target, and bandwidth tuple;
          - family fields record fixed kernels, metrics/policies, boundary/network/time identity, and
            heat solver policy where relevant;
          - event fingerprints, sample size, values, seeds, workers, chunks, and budgets are excluded;
          - the original estimator contract fingerprint remains unchanged;
          - compatible estimators with different events/execution plans yield equal contracts;
          - meaningful family-specific estimator changes yield different contracts;
          - result and ensemble metadata share the same contract object.

          Clean implementation head:

          ```text
          2b867ef171618feb8d812c58a1acf2d29f8c8c2c
          ```

          CI #434 (`30419359103`) passed quality, strict documentation, full tests, branch coverage,
          distributions, installed-wheel smoke, Linux, Windows, macOS, and Python 3.11-3.14.

          ## Exact next implementation subunit: 02H-2 linked result validation types

          Implement only the immutable linked container proposed by the design:

          ```text
          RelativeRiskBootstrapResult
          ```

          02H-2 inputs are already constructed raw and log `BootstrapResult` fixtures. It must not
          calculate ratios or expose a public transformation function.

          Required owned state:

          - raw relative-risk `BootstrapResult`;
          - log-relative-risk `BootstrapResult`;
          - explicit `DenominatorPolicy`;
          - normalization tolerance;
          - deterministic pairing rule;
          - case and control source-result fingerprints;
          - case and control ensemble fingerprints;
          - case and control event fingerprints;
          - case and control seed-ledger fingerprints;
          - combined derived seed fingerprint;
          - observed control invalid/adjusted masks `(M,)`;
          - replicate control invalid/adjusted masks `(B, M)`;
          - immutable metadata and stable linked fingerprint.

          Required validation:

          1. raw field family is `relative_risk` and log field family is `log_relative_risk`;
          2. both nested operations are `bootstrap_relative_risk`;
          3. support, replicate count, confidence level, validity mask, estimator family, and pairing
             fingerprints agree;
          4. case/control source and seed identities are non-empty and distinct;
          5. pairing rule is exactly `same_logical_replicate_index`;
          6. normalization tolerance is finite and positive;
          7. observed masks have shape `(M,)` and replicate masks `(B, M)`;
          8. adjusted masks are subsets of invalid masks;
          9. masks are immutable and finite boolean arrays;
          10. raw valid values are finite/non-negative;
          11. log valid values allow finite numbers and `-inf`, but reject `+inf`;
          12. metadata is immutable and the linked fingerprint changes when any statistical identity
              changes;
          13. memory-budget or execution metadata changes do not change the linked statistical
              fingerprint.

          Add focused fixtures that build nested results manually without calling a numerical ratio
          implementation.

          Generate:

          ```text
          HANDOFF_0.0.16_PROGRESS_02H_2_RELATIVE_RISK_RESULT.md
          docs/development/handoff-0.0.16-progress-02h-2-relative-risk-result.md
          ```

          ## Do not begin during 02H-2

          - public `bootstrap_relative_risk`;
          - numerical raw/log division;
          - density normalization scans;
          - denominator-policy application to source matrices;
          - pooled case-control resampling or permutation;
          - unequal replicate counts;
          - simultaneous bands or p-values;
          - package version bump, ready-for-review transition, or merge.

          ## Recovery checklist

          1. Inspect PR #16, current head, latest CI, and changed files once.
          2. Confirm temporary workflows are absent and package version remains `0.0.15`.
          3. Read all sixteen required records.
          4. Preserve existing Bootstrap results and contract metadata.
          5. Implement only linked result ownership and validation.
          6. Use manually constructed fixtures; do not write numerical transformation code.
          7. Generate both 02H-2 recovery records after full CI.
          8. Do not begin 02H-3 until 02H-2 closes.
          """
          handoff.write_text(text[:start] + suffix, encoding="utf-8")
          PY
      - run: python -m pytest tests/test_bootstrap_relative_risk_contracts.py -q
      - run: python -m mkdocs build --strict
      - name: Commit documentation closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/guides/bootstrap.md mkdocs.yml HANDOFF_NEXT_CONVERSATION.md HANDOFF_0.0.16_PROGRESS_02H_1_RELATIVE_RISK_CONTRACTS.md docs/development/handoff-0.0.16-progress-02h-1-relative-risk-contracts.md
          git commit -m "Document shared relative-risk density contracts"
          git push origin HEAD:agent/uncertainty-separability-scalable-design
