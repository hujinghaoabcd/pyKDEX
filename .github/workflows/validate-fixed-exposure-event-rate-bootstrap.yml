name: Validate fixed-exposure event-rate Bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uncertainty-separability-scalable-design
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: python -m black src/pykdex/uncertainty/event_rate.py src/pykdex/uncertainty/__init__.py tests/test_bootstrap_event_rate.py
      - run: python -m isort src/pykdex/uncertainty/event_rate.py src/pykdex/uncertainty/__init__.py tests/test_bootstrap_event_rate.py
      - run: python -m ruff check src/pykdex/uncertainty/event_rate.py src/pykdex/uncertainty/__init__.py tests/test_bootstrap_event_rate.py
      - run: python -m mypy
      - run: python -m pytest tests/test_bootstrap_event_rate.py -q
      - run: python -c "from pykdex.uncertainty import bootstrap_event_rate; assert callable(bootstrap_event_rate)"
      - name: Commit focused validation formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pykdex/uncertainty/event_rate.py src/pykdex/uncertainty/__init__.py tests/test_bootstrap_event_rate.py
          git diff --cached --quiet || git commit -m "Format fixed-exposure event-rate Bootstrap"
          git push origin HEAD:agent/uncertainty-separability-scalable-design
