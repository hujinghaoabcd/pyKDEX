name: Format current bootstrap files

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==25.1.0 isort==5.13.2
      - run: >-
          python -m black
          src/pykdex/execution/replicates.py
          src/pykdex/uncertainty/__init__.py
          src/pykdex/uncertainty/plan.py
          src/pykdex/uncertainty/seeds.py
          src/pykdex/uncertainty/fields.py
          tests/test_bootstrap_plan_seed_execution.py
          tests/test_uncertainty_fields.py
      - run: >-
          python -m isort
          src/pykdex/execution/replicates.py
          src/pykdex/uncertainty/__init__.py
          src/pykdex/uncertainty/plan.py
          src/pykdex/uncertainty/seeds.py
          src/pykdex/uncertainty/fields.py
          tests/test_bootstrap_plan_seed_execution.py
          tests/test_uncertainty_fields.py
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-bootstrap-current
          path: |
            src/pykdex/execution/replicates.py
            src/pykdex/uncertainty/__init__.py
            src/pykdex/uncertainty/plan.py
            src/pykdex/uncertainty/seeds.py
            src/pykdex/uncertainty/fields.py
            tests/test_bootstrap_plan_seed_execution.py
            tests/test_uncertainty_fields.py
          if-no-files-found: error
