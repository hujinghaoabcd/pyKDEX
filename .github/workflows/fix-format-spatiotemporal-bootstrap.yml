name: Fix and format spatiotemporal Bootstrap

on:
  push:
    branches:
      - agent/uncertainty-separability-scalable-design

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uncertainty-separability-scalable-design
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==25.1.0 isort==5.13.2
      - name: Remove execution metadata from statistical fingerprint
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pykdex/uncertainty/spatiotemporal.py")
          text = path.read_text(encoding="utf-8")
          old = '        metadata.get("execution"),\n'
          if text.count(old) != 1:
              raise RuntimeError("expected exactly one execution fingerprint entry")
          path.write_text(text.replace(old, ""), encoding="utf-8")
          PY
      - name: Add scheduling fingerprint regression assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_bootstrap_spatiotemporal_kde.py")
          text = path.read_text(encoding="utf-8")
          old = '''    assert (
              threaded.ensemble.seed_ledger_fingerprint
              == sequential.ensemble.seed_ledger_fingerprint
          )
          assert sequential.ensemble.execution_metadata["parallel_axis"] == "none"
          '''
          new = '''    assert (
              threaded.ensemble.seed_ledger_fingerprint
              == sequential.ensemble.seed_ledger_fingerprint
          )
          assert (
              threaded.ensemble.observed_field_fingerprint
              == sequential.ensemble.observed_field_fingerprint
          )
          assert sequential.ensemble.execution_metadata["parallel_axis"] == "none"
          '''
          if text.count(old) != 1:
              raise RuntimeError("expected scheduling assertion block once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - run: >-
          python -m black
          src/pykdex/uncertainty/api.py
          src/pykdex/uncertainty/spatiotemporal.py
          tests/test_bootstrap_spatiotemporal_kde.py
      - run: >-
          python -m isort
          src/pykdex/uncertainty/api.py
          src/pykdex/uncertainty/spatiotemporal.py
          tests/test_bootstrap_spatiotemporal_kde.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pykdex/uncertainty/api.py src/pykdex/uncertainty/spatiotemporal.py tests/test_bootstrap_spatiotemporal_kde.py
          git commit -m "Fix and format spatiotemporal Bootstrap"
          git push origin HEAD:agent/uncertainty-separability-scalable-design
