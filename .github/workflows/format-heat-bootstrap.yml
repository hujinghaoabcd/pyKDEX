name: Format heat Bootstrap files

on:
  push:
    branches:
      - agent/uncertainty-separability-scalable-design

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uncertainty-separability-scalable-design
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==25.1.0 isort==5.13.2
      - run: >-
          python -m black
          src/pykdex/uncertainty/api.py
          src/pykdex/uncertainty/heat.py
          tests/test_bootstrap_heat_network_kde.py
      - run: >-
          python -m isort
          src/pykdex/uncertainty/api.py
          src/pykdex/uncertainty/heat.py
          tests/test_bootstrap_heat_network_kde.py
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pykdex/uncertainty/api.py src/pykdex/uncertainty/heat.py tests/test_bootstrap_heat_network_kde.py
          git commit -m "Format heat-network Bootstrap implementation"
          git push origin HEAD:agent/uncertainty-separability-scalable-design
