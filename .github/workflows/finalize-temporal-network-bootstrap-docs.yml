name: Finalize temporal-network Bootstrap documentation

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uncertainty-separability-scalable-design
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - name: Update durable documentation surfaces
        run: |
          python - <<'PY'
          from pathlib import Path

          guide = Path("docs/guides/bootstrap.md")
          text = guide.read_text(encoding="utf-8")
          old = """SpatialEvents + GridSupport + SpatialKDE
          NetworkWorkspace + NetworkKDE
          NetworkWorkspace + HeatNetworkKDE
          SpatiotemporalEvents + SpatiotemporalGridSupport + SpatiotemporalKDE
          """
          new = """SpatialEvents + GridSupport + SpatialKDE
          NetworkWorkspace + NetworkKDE
          NetworkWorkspace + HeatNetworkKDE
          SpatiotemporalEvents + SpatiotemporalGridSupport + SpatiotemporalKDE
          NetworkTimeWorkspace + TemporalNetworkKDE
          """
          if text.count(old) != 1:
              raise RuntimeError("expected one Bootstrap adapter list")
          text = text.replace(old, new)

          marker = "## Network resampling semantics\n"
          addition = """## Temporal-network example

          Temporal-network Bootstrap begins from a prepared `NetworkTimeWorkspace`. It samples each
          accepted snapped network location and its event time as one paired identity.

          ```python
          from pykdex import (
              CyclicTimeDomain,
              NetworkTimeWorkspace,
              SpatialEvents,
              TemporalNetworkKDE,
              load_t_junction,
          )
          from pykdex.execution import ExecutionPlan
          from pykdex.uncertainty import BootstrapPlan, bootstrap_kde

          network = load_t_junction().network
          events = SpatialEvents.from_array(
              [[-0.75, 0.0], [0.5, 0.0], [0.0, 0.5]],
              crs=network.crs,
              spatial_unit=network.spatial_unit,
          )
          workspace = NetworkTimeWorkspace.prepare(
              network,
              events,
              [23.5, 0.5, 8.0],
              temporal_unit="hours",
              lixel_length=0.25,
              temporal_resolution=6.0,
              time_domain=CyclicTimeDomain(period=24.0),
              temporal_origin="study-hour-zero",
              timezone="UTC",
              max_snap_distance=0.05,
          ).with_distances(cutoff=0.8)

          result = bootstrap_kde(
              TemporalNetworkKDE(
                  spatial_bandwidth=0.8,
                  temporal_bandwidth=2.0,
                  junction_policy="simple",
                  target="density",
              ),
              workspace,
              plan=BootstrapPlan(
                  n_resamples=999,
                  confidence_level=0.95,
                  random_state=20260729,
                  execution_plan=ExecutionPlan(
                      memory_budget_bytes=512 * 1024 * 1024,
                      target_chunk_size=2,
                      replicate_chunk_size=2,
                      n_jobs=2,
                      backend="thread",
                  ),
              ),
          )
          ```

          The exact measured support is `workspace.arixels`; a separate support argument is rejected.
          Linear and cyclic time are supported. Ordinary Bootstrap never permutes event time
          independently of snapped network location.

          """
          if text.count(marker) != 1:
              raise RuntimeError("expected one network resampling heading")
          text = text.replace(marker, addition + marker)

          marker = "## Paired space-time resampling semantics\n"
          addition = """### Temporal-network factorized assets

          A prepared temporal-network distance asset is factorized into event-to-lixel network
          distances and time-to-event temporal offsets. For every replicate, pyKDEX:

          - reindexes network-distance rows by sampled accepted-event identity;
          - reindexes temporal-offset and temporal-distance columns by the same sampled identity;
          - preserves target time rows, lixel columns, network, cutoff, directedness, and arixel
            support;
          - rebuilds replicate event and base-workspace fingerprints;
          - rebuilds propagation traces instead of reusing a distance asset for path-based policies.

          Duplicate Bootstrap selections therefore create matching duplicate spatial rows and
          temporal columns. Network location and time cannot become mispaired.

          """
          if text.count(marker) != 1:
              raise RuntimeError("expected one paired space-time heading")
          text = text.replace(marker, addition + marker)

          marker = "Custom estimator components, selectors, adaptive bandwidths, arbitrary callbacks, changing\n"
          addition = """The built-in temporal-network adapter requires:

          - a valid `NetworkTimeWorkspace` with accepted snapped events;
          - exact measured `ArixelSupport` from the workspace;
          - unit accepted-event weights;
          - finite positive numeric scalar spatial and temporal bandwidths;
          - built-in spatial-kernel, temporal-kernel, and junction-policy string names;
          - fixed target, direction, cyclic-tail tolerance, coefficient tolerance, and record limit;
          - paired snapped-location-time event-identity resampling;
          - no bandwidth strategy or selection inside replicates.

          """
          if text.count(marker) != 1:
              raise RuntimeError("expected one custom-component paragraph")
          text = text.replace(marker, addition + marker)

          text = text.replace(
              "Observed space-time field fingerprints deliberately exclude execution metadata.",
              "Observed space-time and temporal-network field fingerprints deliberately exclude "
              "execution metadata. Temporal-network identity is based on the fixed estimator "
              "contract, events, network, and arixel support rather than raw floating-point output "
              "bytes.",
          )
          text = text.replace(
              "kernel-distance working blocks for every requested concurrent worker.\n",
              "kernel-distance working blocks for every requested concurrent worker. Temporal-network "
              "Bootstrap additionally includes reconstructed paired snapped events, factorized network "
              "and time assets, propagation bounds, spatial matrices, and temporal-kernel blocks.\n",
          )
          text = text.replace(
              "domain, temporal origin, timezone, and paired-event resampling unit.\n",
              "domain, temporal origin, timezone, and paired-event resampling unit. Temporal-network "
              "results additionally record the exact arixel support, paired snapped-location-time "
              "resampling unit, and replicate workspace fingerprints.\n",
          )
          text = text.replace("- temporal-network Bootstrap;\n", "")
          guide.write_text(text, encoding="utf-8")

          api = Path("docs/api/uncertainty.md")
          text = api.read_text(encoding="utf-8")
          old = "SpatiotemporalKDE + SpatiotemporalEvents + SpatiotemporalGridSupport\n"
          new = old + "TemporalNetworkKDE + NetworkTimeWorkspace\n"
          if text.count(old) != 1:
              raise RuntimeError("expected one uncertainty dispatch list entry")
          api.write_text(text.replace(old, new), encoding="utf-8")

          mkdocs = Path("mkdocs.yml")
          text = mkdocs.read_text(encoding="utf-8")
          old = "      - 0.0.16 progress 02E: development/handoff-0.0.16-progress-02e-spatiotemporal-bootstrap.md\n"
          new = old + "      - 0.0.16 progress 02F: development/handoff-0.0.16-progress-02f-temporal-network-bootstrap.md\n"
          if text.count(old) != 1:
              raise RuntimeError("expected one 02E MkDocs navigation entry")
          mkdocs.write_text(text.replace(old, new), encoding="utf-8")

          handoff = Path("HANDOFF_NEXT_CONVERSATION.md")
          text = handoff.read_text(encoding="utf-8")
          old = "6. ordinary spatiotemporal Bootstrap on measured product grids.\n"
          new = old + "7. ordinary temporal-network Bootstrap on measured arixel support.\n"
          if text.count(old) != 1:
              raise RuntimeError("expected one completed-subunit list ending")
          text = text.replace(old, new)
          old = """The exact next implementation unit is ordinary Bootstrap for the existing temporal-network KDE
          family. Do not begin risk-derived Bootstrap, separability diagnostics, or permutation testing
          before the temporal-network unit is designed, implemented, documented, and validated.
          """
          new = """The exact next implementation unit is fixed-exposure event-rate Bootstrap. Do not begin
          independent case-control relative-risk Bootstrap, uncertain-exposure Bootstrap, separability
          diagnostics, or permutation testing before the fixed-exposure event-rate unit is designed,
          implemented, documented, and validated.
          """
          if text.count(old) != 1:
              raise RuntimeError("expected one next-unit summary")
          text = text.replace(old, new)
          old = "10. `HANDOFF_0.0.16_PROGRESS_02E_SPATIOTEMPORAL_BOOTSTRAP.md`.\n"
          new = old + "11. `HANDOFF_0.0.16_PROGRESS_02F_TEMPORAL_NETWORK_BOOTSTRAP.md`.\n"
          if text.count(old) != 1:
              raise RuntimeError("expected one read-order ending")
          text = text.replace(old, new)
          text = text.replace(
              "- exact next unit: temporal-network ordinary Bootstrap.\n",
              "- exact next unit: fixed-exposure event-rate Bootstrap.\n",
          )
          text = text.replace(
              "The later example, guide, API, handoff, navigation, and PR-description commits require their own\nfinal CI inspection.\n",
              "Final 02E documentation and handoff head `f4d9ca0652904e8c546e20ee2d34301ba2a94e72`\npassed CI #397 (`30387640653`) across the complete repository matrix.\n",
          )
          start = text.index("## Exact next unit: 02F temporal-network Bootstrap\n")
          suffix = """## Completed subunit 02F: ordinary temporal-network Bootstrap

          Closed domain:

          ```text
          NetworkTimeWorkspace + TemporalNetworkKDE -> bootstrap_kde
          ```

          Statistical rules:

          - resample accepted snapped-network-location-plus-time identities after snapping;
          - use one sampled-index sequence for network location, time, and optional marks;
          - preserve accepted-event count, rejection audit, network, lixels, and exact arixels;
          - preserve CRS, spatial/temporal units, time domain, temporal origin, and timezone;
          - create unique replicate-local IDs and retain sampled source indices;
          - require unit weights and fixed numeric scalar spatial/temporal bandwidths;
          - require built-in kernel and junction-policy string names;
          - support simple, discontinuous, and continuous policies;
          - support linear and cyclic time without independent time permutation;
          - reindex event-to-lixel rows and temporal-offset/distance columns by the same event axis;
          - rebuild path propagation traces for path-based policies.

          Execution and identity:

          - outer replicate ranges may be threaded;
          - every inner `TemporalNetworkKDE` is sequential and chunks only target time rows;
          - explicit Bootstrap target chunks override legacy estimator `time_chunk_size`;
          - seed and replicate identity are independent of workers and chunks;
          - observed-field identity uses the fixed estimator contract, events, network, and arixel
            support rather than raw floating-point output bytes;
          - memory preflight includes complete ensemble, reconstructed workspaces, factorized assets,
            propagation bounds, spatial matrices, temporal blocks, and concurrent outputs;
          - source estimator and workspace remain unchanged.

          Clean implementation head:

          ```text
          2636e6c542359ef89decb6896cfadb267460bd03
          ```

          CI #404 (`30415551843`) passed quality, strict documentation, full tests, branch coverage,
          distributions, installed-wheel smoke, Linux, Windows, macOS, and Python 3.11-3.14.

          ## Exact next unit: 02G fixed-exposure event-rate Bootstrap

          Inspect the exact current contracts in:

          ```text
          src/pykdex/risk/
          src/pykdex/uncertainty/
          existing exposure and event-rate tests and handoffs
          ```

          Design and implement only the fixed-exposure event-rate uncertainty path. Required decisions:

          1. identify which completed intensity Bootstrap families can feed event-rate uncertainty;
          2. require exact measured support compatibility between every intensity field and exposure;
          3. treat exposure as fixed and record that conditioning explicitly;
          4. preserve the existing explicit zero-denominator policy without hidden epsilon;
          5. decide whether to transform a completed intensity ensemble or wrap each intensity replicate;
          6. retain separate intensity, exposure, and event-rate fingerprints;
          7. budget the complete transformed event-rate ensemble before allocation;
          8. return pointwise percentile intervals labelled as event uncertainty conditional on fixed
             exposure;
          9. test spatial, network, ordinary space-time, and network-time measured supports where the
             current risk contracts permit them;
          10. generate `HANDOFF_0.0.16_PROGRESS_02G_FIXED_EXPOSURE_EVENT_RATE_BOOTSTRAP.md` and pass full CI.

          ## Do not begin during 02G

          - uncertain-exposure Bootstrap;
          - independent case-control relative-risk Bootstrap;
          - pooled case-control resampling;
          - separability diagnostics;
          - permutation p-values;
          - weighted or adaptive built-in Bootstrap;
          - bandwidth selection inside replicates;
          - BCa, bootstrap-t, basic, or simultaneous intervals;
          - streaming or disk-backed ensembles;
          - persistence changes;
          - package version bump;
          - ready-for-review transition or merge.

          ## Recovery checklist

          1. Inspect PR #16, current head, changed files, and latest CI once.
          2. Confirm PR is open, Draft, unmerged, and version remains `0.0.15`.
          3. Confirm temporary workflows, formatting artifacts, placeholders, and diagnostic logs are absent.
          4. Read all eleven required records.
          5. Preserve execution, seed ordering, exact support, paired-event identity, and fail-fast contracts.
          6. Inspect exact risk, exposure, event-rate, and uncertainty types before coding.
          7. Implement only fixed-exposure event-rate Bootstrap.
          8. Generate root and docs 02G handoffs after the numerical unit passes full CI.
          9. Do not move to relative-risk or separability before 02G closes.
          """
          handoff.write_text(text[:start] + suffix, encoding="utf-8")
          PY
      - run: python -m black examples/22_temporal_network_bootstrap.py
      - run: python -m isort examples/22_temporal_network_bootstrap.py
      - run: python examples/22_temporal_network_bootstrap.py
      - run: python -m pytest tests/test_bootstrap_temporal_network_kde.py -q
      - run: python -m mkdocs build --strict
      - name: Commit documentation closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/22_temporal_network_bootstrap.py docs/guides/bootstrap.md docs/api/uncertainty.md docs/development/handoff-0.0.16-progress-02f-temporal-network-bootstrap.md HANDOFF_0.0.16_PROGRESS_02F_TEMPORAL_NETWORK_BOOTSTRAP.md HANDOFF_NEXT_CONVERSATION.md mkdocs.yml
          git commit -m "Document temporal-network Bootstrap"
          git push origin HEAD:agent/uncertainty-separability-scalable-design
