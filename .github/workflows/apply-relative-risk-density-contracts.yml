name: Apply shared relative-risk density contracts

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uncertainty-separability-scalable-design
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - name: Inject normalized contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError(f"{path}: expected one replacement target")
              path.write_text(text.replace(old, new), encoding="utf-8")

          def add_import(path: Path) -> None:
              old = "from pykdex.uncertainty.fields import FieldEnsemble, pointwise_percentile_interval\n"
              new = (
                  "from pykdex.uncertainty.contracts import build_relative_risk_contract\n"
                  + old
              )
              replace_once(path, old, new)

          spatial = Path("src/pykdex/uncertainty/spatial.py")
          add_import(spatial)
          marker = "    ensemble = FieldEnsemble(\n"
          block = '''    relative_risk_contract, relative_risk_contract_fingerprint = (
              build_relative_risk_contract(
                  result_family="spatial",
                  support_fingerprint=contract.support_fingerprint,
                  target=contract.target,
                  bandwidths=(contract.bandwidth,),
                  components={
                      "kernel": contract.kernel,
                      "metric": contract.metric,
                      "boundary_correction": contract.boundary_correction,
                      "boundary_fingerprint": (
                          None if contract.boundary is None else contract.boundary.fingerprint
                      ),
                  },
              )
          )
          '''
          replace_once(spatial, marker, block + marker)
          text = spatial.read_text(encoding="utf-8")
          old = '            "estimator_contract_fingerprint": contract.fingerprint,\n'
          if text.count(old) != 2:
              raise RuntimeError("spatial: expected two estimator contract metadata entries")
          insertion = old + '            "relative_risk_contract": relative_risk_contract,\n' + '            "relative_risk_contract_fingerprint": relative_risk_contract_fingerprint,\n'
          spatial.write_text(text.replace(old, insertion), encoding="utf-8")

          network = Path("src/pykdex/uncertainty/network.py")
          add_import(network)
          block = '''    relative_risk_contract, relative_risk_contract_fingerprint = (
              build_relative_risk_contract(
                  result_family="network",
                  support_fingerprint=contract.support_fingerprint,
                  target=contract.target,
                  bandwidths=(contract.bandwidth,),
                  components={
                      "kernel": contract.kernel,
                      "junction_policy": contract.junction_policy,
                      "directed": contract.effective_directed,
                      "network_fingerprint": contract.network_fingerprint,
                      "path_based": contract.junction_policy != "simple",
                      "coefficient_tolerance": contract.coefficient_tolerance,
                      "max_records_per_event": contract.max_records_per_event,
                  },
              )
          )
          '''
          replace_once(network, marker, block + marker)
          text = network.read_text(encoding="utf-8")
          if text.count(old) != 2:
              raise RuntimeError("network: expected two estimator contract metadata entries")
          network.write_text(text.replace(old, insertion), encoding="utf-8")

          heat = Path("src/pykdex/uncertainty/heat.py")
          add_import(heat)
          marker_heat = "    common_metadata: dict[str, Any] = {\n"
          block = '''    relative_risk_contract, relative_risk_contract_fingerprint = (
              build_relative_risk_contract(
                  result_family="heat_network",
                  support_fingerprint=contract.support_fingerprint,
                  target=contract.target,
                  bandwidths=(contract.diffusion_time,),
                  components={
                      "estimator_kind": "heat_equation",
                      "diffusion_time": contract.diffusion_time,
                      "mesh_size": contract.mesh_size,
                      "negative_tolerance": contract.negative_tolerance,
                      "network_fingerprint": contract.network_fingerprint,
                      "solver_policy": "source_dof_threshold_auto",
                      "dense_threshold_policy": _DEFAULT_DENSE_THRESHOLD,
                  },
              )
          )
          '''
          replace_once(heat, marker_heat, block + marker_heat)
          text = heat.read_text(encoding="utf-8")
          if text.count('        "estimator_contract_fingerprint": contract.fingerprint,\n') != 1:
              raise RuntimeError("heat: expected one estimator contract metadata entry")
          text = text.replace(
              '        "estimator_contract_fingerprint": contract.fingerprint,\n',
              '        "estimator_contract_fingerprint": contract.fingerprint,\n'
              '        "relative_risk_contract": relative_risk_contract,\n'
              '        "relative_risk_contract_fingerprint": relative_risk_contract_fingerprint,\n',
          )
          heat.write_text(text, encoding="utf-8")

          spatiotemporal = Path("src/pykdex/uncertainty/spatiotemporal.py")
          add_import(spatiotemporal)
          marker_common = "    common_metadata = {\n"
          block = '''    relative_risk_contract, relative_risk_contract_fingerprint = (
              build_relative_risk_contract(
                  result_family="spatiotemporal",
                  support_fingerprint=contract.support_fingerprint,
                  target=contract.target,
                  bandwidths=(contract.spatial_bandwidth, contract.temporal_bandwidth),
                  components={
                      "spatial_kernel": contract.spatial_kernel,
                      "temporal_kernel": contract.temporal_kernel,
                      "spatial_metric": contract.spatial_metric,
                      "cyclic_tail_tolerance": contract.cyclic_tail_tolerance,
                      "time_domain_fingerprint": contract.event_time_domain_fingerprint,
                  },
              )
          )
          '''
          replace_once(spatiotemporal, marker_common, block + marker_common)
          text = spatiotemporal.read_text(encoding="utf-8")
          if text.count('        "estimator_contract_fingerprint": contract.fingerprint,\n') != 1:
              raise RuntimeError("spatiotemporal: expected one estimator contract entry")
          text = text.replace(
              '        "estimator_contract_fingerprint": contract.fingerprint,\n',
              '        "estimator_contract_fingerprint": contract.fingerprint,\n'
              '        "relative_risk_contract": relative_risk_contract,\n'
              '        "relative_risk_contract_fingerprint": relative_risk_contract_fingerprint,\n',
          )
          spatiotemporal.write_text(text, encoding="utf-8")

          network_time = Path("src/pykdex/uncertainty/network_time.py")
          add_import(network_time)
          marker_nt = "    common_metadata: dict[str, Any] = {\n"
          block = '''    relative_risk_contract, relative_risk_contract_fingerprint = (
              build_relative_risk_contract(
                  result_family="network_time",
                  support_fingerprint=contract.support_fingerprint,
                  target=contract.target,
                  bandwidths=(contract.spatial_bandwidth, contract.temporal_bandwidth),
                  components={
                      "spatial_kernel": contract.spatial_kernel,
                      "temporal_kernel": contract.temporal_kernel,
                      "junction_policy": contract.junction_policy,
                      "directed": contract.effective_directed,
                      "network_fingerprint": contract.network_fingerprint,
                      "path_based": contract.junction_policy != "simple",
                      "cyclic_tail_tolerance": contract.cyclic_tail_tolerance,
                      "coefficient_tolerance": contract.coefficient_tolerance,
                      "max_records_per_event": contract.max_records_per_event,
                      "time_domain_fingerprint": contract.time_domain_fingerprint,
                  },
              )
          )
          '''
          replace_once(network_time, marker_nt, block + marker_nt)
          text = network_time.read_text(encoding="utf-8")
          if text.count('        "estimator_contract_fingerprint": contract.fingerprint,\n') != 1:
              raise RuntimeError("network_time: expected one estimator contract entry")
          text = text.replace(
              '        "estimator_contract_fingerprint": contract.fingerprint,\n',
              '        "estimator_contract_fingerprint": contract.fingerprint,\n'
              '        "relative_risk_contract": relative_risk_contract,\n'
              '        "relative_risk_contract_fingerprint": relative_risk_contract_fingerprint,\n',
          )
          network_time.write_text(text, encoding="utf-8")
          PY
      - run: python -m black src/pykdex/uncertainty/contracts.py src/pykdex/uncertainty/spatial.py src/pykdex/uncertainty/network.py src/pykdex/uncertainty/heat.py src/pykdex/uncertainty/spatiotemporal.py src/pykdex/uncertainty/network_time.py tests/test_bootstrap_relative_risk_contracts.py
      - run: python -m isort src/pykdex/uncertainty/contracts.py src/pykdex/uncertainty/spatial.py src/pykdex/uncertainty/network.py src/pykdex/uncertainty/heat.py src/pykdex/uncertainty/spatiotemporal.py src/pykdex/uncertainty/network_time.py tests/test_bootstrap_relative_risk_contracts.py
      - run: python -m ruff check src/pykdex/uncertainty/contracts.py src/pykdex/uncertainty/spatial.py src/pykdex/uncertainty/network.py src/pykdex/uncertainty/heat.py src/pykdex/uncertainty/spatiotemporal.py src/pykdex/uncertainty/network_time.py tests/test_bootstrap_relative_risk_contracts.py
      - run: python -m mypy
      - run: python -m pytest tests/test_bootstrap_relative_risk_contracts.py -q
      - name: Commit normalized contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pykdex/uncertainty/contracts.py src/pykdex/uncertainty/spatial.py src/pykdex/uncertainty/network.py src/pykdex/uncertainty/heat.py src/pykdex/uncertainty/spatiotemporal.py src/pykdex/uncertainty/network_time.py tests/test_bootstrap_relative_risk_contracts.py
          git commit -m "Add shared relative-risk density contracts"
          git push origin HEAD:agent/uncertainty-separability-scalable-design
