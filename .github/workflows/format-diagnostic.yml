name: Format diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install black isort
      - run: python -m black src/pykdex/risk tests/test_exposure_field.py
      - run: python -m isort src/pykdex/risk tests/test_exposure_field.py
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-risk-foundation
          path: |
            src/pykdex/risk
            tests/test_exposure_field.py
