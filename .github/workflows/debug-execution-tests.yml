name: Debug execution tests

on:
  push:
    branches:
      - agent/uncertainty-separability-scalable-design

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Run focused execution tests
        shell: bash
        run: |
          set +e
          python -m pytest -vv --tb=long \
            tests/test_execution_plan.py \
            tests/test_execution_spatial_integration.py \
            tests/test_execution_network_integration.py \
            tests/test_execution_network_time_integration.py \
            tests/test_execution_heat_integration.py \
            > execution-test-output.txt 2>&1
          status=$?
          echo "exit_status=$status" >> execution-test-output.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: execution-test-output
          path: execution-test-output.txt
          if-no-files-found: error
