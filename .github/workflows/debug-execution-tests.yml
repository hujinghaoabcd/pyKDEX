name: Debug execution integration tests

on:
  push:
    branches:
      - agent/uncertainty-separability-scalable-design

permissions:
  contents: write

jobs:
  debug:
    if: ${{ !contains(github.event.head_commit.message, 'Capture execution test diagnostics') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Capture focused tests
        run: |
          set +e
          python -m pytest -vv --tb=short \
            tests/test_execution_plan.py \
            tests/test_execution_spatial_integration.py \
            > DEBUG_EXECUTION_TESTS.txt 2>&1
          status=$?
          echo "exit_status=$status" >> DEBUG_EXECUTION_TESTS.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEBUG_EXECUTION_TESTS.txt
          git commit -m "Capture execution test diagnostics"
          git push
