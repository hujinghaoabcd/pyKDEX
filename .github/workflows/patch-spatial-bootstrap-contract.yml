name: Patch spatial Bootstrap contract

on:
  push:
    branches:
      - agent/uncertainty-separability-scalable-design

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Close spatial Bootstrap component contract') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==25.1.0 isort==5.13.2
      - name: Apply exact contract patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pykdex/uncertainty/spatial.py")
          text = path.read_text(encoding="utf-8")
          old_import = '''from pykdex.execution.replicates import (
              execute_replicate_chunks,
              resolve_replicate_execution,
          )
          '''
          new_import = '''from pykdex.execution.replicates import (
              ResolvedReplicateExecution,
              execute_replicate_chunks,
              resolve_replicate_execution,
          )
          '''
          if text.count(old_import) != 1:
              raise RuntimeError("replicate import block not found exactly once")
          text = text.replace(old_import, new_import)

          old_contract = '''    bandwidth = _require_fixed_scalar_bandwidth(estimator)
              kernel = get_kernel(estimator.kernel)
              metric = get_metric(estimator.metric)
              correction = get_boundary_correction(estimator.boundary_correction)
          '''
          new_contract = '''    bandwidth = _require_fixed_scalar_bandwidth(estimator)
              for name, value in (
                  ("kernel", estimator.kernel),
                  ("metric", estimator.metric),
                  ("boundary_correction", estimator.boundary_correction),
              ):
                  if not isinstance(value, str):
                      raise ValueError(
                          "bootstrap_kde initially requires built-in string names for "
                          f"kernel, metric, and boundary_correction; {name} was an object."
                      )
              kernel = get_kernel(estimator.kernel)
              metric = get_metric(estimator.metric)
              correction = get_boundary_correction(estimator.boundary_correction)
          '''
          if text.count(old_contract) != 1:
              raise RuntimeError("contract block not found exactly once")
          text = text.replace(old_contract, new_contract)

          old_annotation = ''') -> tuple[object, ExecutionPlan, dict[str, int]]:
          '''
          new_annotation = ''') -> tuple[ResolvedReplicateExecution, ExecutionPlan, dict[str, int]]:
          '''
          if text.count(old_annotation) != 1:
              raise RuntimeError("return annotation not found exactly once")
          text = text.replace(old_annotation, new_annotation)
          path.write_text(text, encoding="utf-8")
          PY
      - run: >-
          python -m black
          src/pykdex/uncertainty/spatial.py
          tests/test_bootstrap_spatial_closed_components.py
      - run: >-
          python -m isort
          src/pykdex/uncertainty/spatial.py
          tests/test_bootstrap_spatial_closed_components.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pykdex/uncertainty/spatial.py \
            tests/test_bootstrap_spatial_closed_components.py
          git commit -m "Close spatial Bootstrap component contract"
          git push
