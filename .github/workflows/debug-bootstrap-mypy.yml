name: Debug bootstrap mypy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Capture mypy output
        shell: bash
        run: |
          set +e
          python -m mypy > bootstrap-mypy.txt 2>&1
          status=$?
          echo "exit_status=$status" >> bootstrap-mypy.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-mypy
          path: bootstrap-mypy.txt
          if-no-files-found: error
