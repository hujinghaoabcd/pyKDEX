name: Debug spatial Bootstrap quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - name: Capture quality output
        shell: bash
        run: |
          set +e
          {
            echo "=== BLACK ==="
            python -m black --check src tests tools examples
            echo "black_status=$?"
            echo "=== ISORT ==="
            python -m isort --check-only src tests tools examples
            echo "isort_status=$?"
            echo "=== RUFF ==="
            python -m ruff check src tests tools examples
            echo "ruff_status=$?"
            echo "=== MYPY ==="
            python -m mypy
            echo "mypy_status=$?"
          } > spatial-bootstrap-quality.txt 2>&1
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: spatial-bootstrap-quality
          path: spatial-bootstrap-quality.txt
          if-no-files-found: error
