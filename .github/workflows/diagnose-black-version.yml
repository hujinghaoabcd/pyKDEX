name: Diagnose Black version and diff

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uncertainty-separability-scalable-design
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: |
          mkdir -p diagnosis
          python -m black --version > diagnosis/version.txt
          set +e
          python -m black --check --diff src tests tools examples > diagnosis/diff.txt 2>&1
          status=$?
          echo "$status" > diagnosis/status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: black-diagnosis
          path: diagnosis
          if-no-files-found: error
