name: Format bootstrap foundation

on:
  push:
    branches:
      - agent/uncertainty-separability-scalable-design

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'Format bootstrap foundation files') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==25.1.0 isort==5.13.2
      - name: Make non-finite empirical quantiles order based
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pykdex/uncertainty/fields.py")
          text = path.read_text(encoding="utf-8")
          old = '''        values = ensemble.replicate_values[:, valid_indices]
        lower[valid_indices] = np.quantile(values, alpha / 2.0, axis=0)
        upper[valid_indices] = np.quantile(values, 1.0 - alpha / 2.0, axis=0)
        finite_columns = np.all(np.isfinite(values), axis=0)
        if np.any(finite_columns):
            selected = valid_indices[finite_columns]
            finite_values = values[:, finite_columns]
            standard_error[selected] = np.std(finite_values, axis=0, ddof=1)
            bias[selected] = (
                np.mean(finite_values, axis=0)
                - ensemble.observed_values[selected]
            )
'''
          new = '''        values = ensemble.replicate_values[:, valid_indices]
        finite_columns = np.all(np.isfinite(values), axis=0)
        if np.any(finite_columns):
            selected = valid_indices[finite_columns]
            finite_values = values[:, finite_columns]
            lower[selected] = np.quantile(finite_values, alpha / 2.0, axis=0)
            upper[selected] = np.quantile(
                finite_values,
                1.0 - alpha / 2.0,
                axis=0,
            )
            standard_error[selected] = np.std(finite_values, axis=0, ddof=1)
            bias[selected] = (
                np.mean(finite_values, axis=0)
                - ensemble.observed_values[selected]
            )
        nonfinite_columns = ~finite_columns
        if np.any(nonfinite_columns):
            selected = valid_indices[nonfinite_columns]
            nonfinite_values = values[:, nonfinite_columns]
            lower[selected] = np.quantile(
                nonfinite_values,
                alpha / 2.0,
                axis=0,
                method="inverted_cdf",
            )
            upper[selected] = np.quantile(
                nonfinite_values,
                1.0 - alpha / 2.0,
                axis=0,
                method="inverted_cdf",
            )
'''
          if text.count(old) != 1:
              raise RuntimeError("expected one pointwise quantile block")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - run: >-
          python -m black
          src/pykdex/execution/replicates.py
          src/pykdex/uncertainty/__init__.py
          src/pykdex/uncertainty/plan.py
          src/pykdex/uncertainty/seeds.py
          src/pykdex/uncertainty/fields.py
          tests/test_bootstrap_plan_seed_execution.py
          tests/test_uncertainty_fields.py
      - run: >-
          python -m isort
          src/pykdex/execution/replicates.py
          src/pykdex/uncertainty/__init__.py
          src/pykdex/uncertainty/plan.py
          src/pykdex/uncertainty/seeds.py
          src/pykdex/uncertainty/fields.py
          tests/test_bootstrap_plan_seed_execution.py
          tests/test_uncertainty_fields.py
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pykdex/execution/replicates.py \
            src/pykdex/uncertainty/__init__.py \
            src/pykdex/uncertainty/plan.py \
            src/pykdex/uncertainty/seeds.py \
            src/pykdex/uncertainty/fields.py \
            tests/test_bootstrap_plan_seed_execution.py \
            tests/test_uncertainty_fields.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format bootstrap foundation files"
          git push
