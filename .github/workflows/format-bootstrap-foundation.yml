name: Format bootstrap foundation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black==25.1.0 isort==5.13.2
      - name: Make non-finite empirical quantiles order based
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pykdex/uncertainty/fields.py")
          text = path.read_text(encoding="utf-8")
          start_marker = "        values = ensemble.replicate_values[:, valid_indices]\n"
          end_marker = "    return PointwiseInterval(\n"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''        values = ensemble.replicate_values[:, valid_indices]
          finite_columns = np.all(np.isfinite(values), axis=0)
          if np.any(finite_columns):
              selected = valid_indices[finite_columns]
              finite_values = values[:, finite_columns]
              lower[selected] = np.quantile(finite_values, alpha / 2.0, axis=0)
              upper[selected] = np.quantile(
                  finite_values,
                  1.0 - alpha / 2.0,
                  axis=0,
              )
              standard_error[selected] = np.std(finite_values, axis=0, ddof=1)
              bias[selected] = (
                  np.mean(finite_values, axis=0)
                  - ensemble.observed_values[selected]
              )
          nonfinite_columns = ~finite_columns
          if np.any(nonfinite_columns):
              selected = valid_indices[nonfinite_columns]
              nonfinite_values = values[:, nonfinite_columns]
              lower[selected] = np.quantile(
                  nonfinite_values,
                  alpha / 2.0,
                  axis=0,
                  method="inverted_cdf",
              )
              upper[selected] = np.quantile(
                  nonfinite_values,
                  1.0 - alpha / 2.0,
                  axis=0,
                  method="inverted_cdf",
              )
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
      - run: >-
          python -m black
          src/pykdex/execution/replicates.py
          src/pykdex/uncertainty/__init__.py
          src/pykdex/uncertainty/plan.py
          src/pykdex/uncertainty/seeds.py
          src/pykdex/uncertainty/fields.py
          tests/test_bootstrap_plan_seed_execution.py
          tests/test_uncertainty_fields.py
      - run: >-
          python -m isort
          src/pykdex/execution/replicates.py
          src/pykdex/uncertainty/__init__.py
          src/pykdex/uncertainty/plan.py
          src/pykdex/uncertainty/seeds.py
          src/pykdex/uncertainty/fields.py
          tests/test_bootstrap_plan_seed_execution.py
          tests/test_uncertainty_fields.py
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-bootstrap-foundation
          path: |
            src/pykdex/execution/replicates.py
            src/pykdex/uncertainty/__init__.py
            src/pykdex/uncertainty/plan.py
            src/pykdex/uncertainty/seeds.py
            src/pykdex/uncertainty/fields.py
            tests/test_bootstrap_plan_seed_execution.py
            tests/test_uncertainty_fields.py
          if-no-files-found: error
