name: Sort execution imports

on:
  push:
    branches:
      - agent/uncertainty-separability-scalable-design

permissions:
  contents: write

jobs:
  sort:
    if: ${{ !contains(github.event.head_commit.message, 'Apply isort to execution integration') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install isort==5.13.2
      - run: python -m isort src tests tools examples
      - name: Commit exact import order
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests tools examples
          git commit -m "Apply isort to execution integration"
          git push
