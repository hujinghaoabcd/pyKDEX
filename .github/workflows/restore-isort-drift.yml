name: Restore unrelated isort drift

on:
  push:
    branches:
      - agent/uncertainty-separability-scalable-design

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, 'Restore unrelated files after isort') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact pre-existing import layout
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "src/pykdex/bandwidths/__init__.py": (
                  "from pykdex.bandwidths.selection import LeastSquaresCVBandwidth, LikelihoodCVBandwidth\n",
                  "from pykdex.bandwidths.selection import (\n"
                  "    LeastSquaresCVBandwidth,\n"
                  "    LikelihoodCVBandwidth,\n"
                  ")\n",
              ),
              "src/pykdex/estimators/network_kde.py": (
                  "from pykdex.bandwidths.network import BaseNetworkBandwidth, get_network_bandwidth\n",
                  "from pykdex.bandwidths.network import (\n"
                  "    BaseNetworkBandwidth,\n"
                  "    get_network_bandwidth,\n"
                  ")\n",
              ),
              "src/pykdex/selection/network_time.py": (
                  "from pykdex.core.network_time_results import NetworkTimeBandwidthSelectionResult\n",
                  "from pykdex.core.network_time_results import (\n"
                  "    NetworkTimeBandwidthSelectionResult,\n"
                  ")\n",
              ),
              "src/pykdex/selection/selectors.py": (
                  "from pykdex.selection.optimization import minimize_bandwidth_objective, validate_bounds\n",
                  "from pykdex.selection.optimization import (\n"
                  "    minimize_bandwidth_objective,\n"
                  "    validate_bounds,\n"
                  ")\n",
              ),
              "src/pykdex/selection/spatiotemporal.py": (
                  "from pykdex.core.spatiotemporal_results import SpatiotemporalBandwidthSelectionResult\n",
                  "from pykdex.core.spatiotemporal_results import (\n"
                  "    SpatiotemporalBandwidthSelectionResult,\n"
                  ")\n",
              ),
              "src/pykdex/temporal/__init__.py": (
                  "from pykdex.temporal.domain import BaseTimeDomain, CyclicTimeDomain, LinearTimeDomain\n",
                  "from pykdex.temporal.domain import (\n"
                  "    BaseTimeDomain,\n"
                  "    CyclicTimeDomain,\n"
                  "    LinearTimeDomain,\n"
                  ")\n",
              ),
              "tests/test_adaptive_bandwidths.py": (
                  "from pykdex import AbramsonBandwidth, KNNBandwidth, LikelihoodCVBandwidth, SpatialKDE\n",
                  "from pykdex import (\n"
                  "    AbramsonBandwidth,\n"
                  "    KNNBandwidth,\n"
                  "    LikelihoodCVBandwidth,\n"
                  "    SpatialKDE,\n"
                  ")\n",
              ),
              "tests/test_data_objects.py": (
                  "from pykdex import DataProvenance, GridSupport, PointSupport, SpatialEvents\n",
                  "from pykdex import (\n"
                  "    DataProvenance,\n"
                  "    GridSupport,\n"
                  "    PointSupport,\n"
                  "    SpatialEvents,\n"
                  ")\n",
              ),
              "tests/test_datasets.py": (
                  "from pykdex import load_bimodal_points, make_bimodal_events, make_moving_hotspot_events\n",
                  "from pykdex import (\n"
                  "    load_bimodal_points,\n"
                  "    make_bimodal_events,\n"
                  "    make_moving_hotspot_events,\n"
                  ")\n",
              ),
          }

          for name, (old, new) in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError(f"{name}: exact isort drift not found")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Commit restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Restore unrelated files after isort"
          git push
