name: Restore unrelated isort drift

on:
  push:
    branches:
      - agent/uncertainty-separability-scalable-design

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, 'Restore unrelated files after isort') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore files from main
        run: |
          git checkout origin/main -- \
            src/pykdex/bandwidths/__init__.py \
            src/pykdex/estimators/network_kde.py \
            src/pykdex/selection/network_time.py \
            src/pykdex/selection/selectors.py \
            src/pykdex/selection/spatiotemporal.py \
            src/pykdex/temporal/__init__.py \
            tests/test_adaptive_bandwidths.py \
            tests/test_data_objects.py \
            tests/test_datasets.py
      - name: Commit restoration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Restore unrelated files after isort"
          git push
